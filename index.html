<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Henry Guo — Data Scientist</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""
>
<style>
  :root {
    --bg: #232e29;
    --surface: #2c3a34;
    --border: #3d4e47;
    --accent: #d4af61;
    --accent2: #c24a3d;
    --text: #f0ebe2;
    --muted: #9aa396;
    --card-bg: #27332e;
    /* Between 110% and 125% browser zoom; scales px layout and type together */
    --page-scale: 1.175;
    --timeline-align-offset: 52px;
  }

  html {
    zoom: var(--page-scale);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(115, 155, 135, 0.09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(115, 155, 135, 0.09) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  /* Soft centered wash — avoids a bright patch in the top-left corner */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 100% 55% at 50% 0%, rgba(90, 135, 115, 0.06) 0%, transparent 62%);
    pointer-events: none;
    z-index: 0;
  }

  main {
    position: relative;
    z-index: 1;
    max-width: 1380px;
    margin: 0 auto;
    padding: 80px 32px 120px;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* ── PAGE SHELL: primary (hero + projects) left, experience rail right ── */
  .page-shell {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto;
    gap: 0;
    align-items: start;
  }

  .hero {
    grid-column: 1;
    grid-row: 1;
    min-width: 0;
  }

  .experience-rail {
    grid-column: 1;
    grid-row: 2;
    min-width: 0;
    animation: fadeUp 0.85s 0.12s ease both;
  }

  .page-projects {
    grid-column: 1;
    grid-row: 3;
    min-width: 0;
    margin-top: 0;
  }

  @media (min-width: 961px) {
    .page-shell {
      grid-template-columns: minmax(0, 1fr) minmax(360px, 480px);
      grid-template-rows: auto auto;
      column-gap: 28px;
    }

    .hero {
      grid-column: 1;
      grid-row: 1;
    }

    .experience-rail {
      grid-column: 2;
      grid-row: 1 / span 2;
      align-self: start;
      position: sticky;
      top: 80px;
      padding-top: var(--timeline-align-offset);
      max-height: calc(100vh - 96px);
      overflow-y: auto;
      overflow-x: visible;
      -webkit-overflow-scrolling: touch;
    }

    .page-projects {
      grid-column: 1;
      grid-row: 2;
      margin-top: 72px;
    }
  }

  /* ── EXPERIENCE RAIL (education | spine | jobs + connectors) ── */
  .experience-heading {
    font-family: 'Syne', sans-serif;
    font-size: clamp(11px, 1.1vw, 13px);
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 18px;
    text-align: left;
  }

  .experience-rail-inner {
    position: relative;
    min-width: 0;
  }

  .exp-layout {
    display: grid;
    grid-template-columns: minmax(100px, 148px) 56px minmax(0, 1fr);
    gap: 12px 14px;
    align-items: stretch;
  }

  .exp-education-col {
    grid-column: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-self: start;
    min-width: 0;
  }

  .exp-entry--education-only .exp-chip {
    background: rgba(44, 58, 52, 0.78);
    border-color: rgba(194, 74, 61, 0.32);
  }

  .exp-spine-col {
    grid-column: 2;
    display: flex;
    flex-direction: column;
    min-width: 56px;
    align-self: stretch;
  }

  .exp-spine-track {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    flex: 1 1 auto;
    border-radius: 6px 0 0 6px;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
  }

  .exp-spine-segment {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 40px;
    padding: 6px 4px;
    position: relative;
  }

  .exp-spine-year-text {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    white-space: nowrap;
    user-select: none;
  }

  .exp-spine-row--divider-spacer {
    flex: 0 0 44px;
    min-height: 44px;
    border-right: 2px dashed var(--border);
    margin: 4px 0;
    opacity: 0.65;
  }

  .exp-jobs-col {
    grid-column: 3;
    min-width: 0;
  }

  .exp-jobs-track {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    min-height: 0;
  }

  .exp-jobs-year-cluster {
    display: flex;
    flex-direction: column;
    gap: 8px;
    justify-content: flex-start;
  }

  .exp-jobs-year-cluster--gap {
    min-height: 40px;
    pointer-events: none;
  }

  .exp-job-row {
    display: grid;
    grid-template-columns: 36px minmax(0, 1fr);
    gap: 10px;
    align-items: start;
  }

  .exp-job-connector {
    width: 100%;
    height: 2px;
    margin-top: 12px;
    border-radius: 2px;
    align-self: center;
  }

  .exp-job-body {
    min-width: 0;
  }

  .exp-chip {
    width: 100%;
    margin: 0;
    padding: 6px 9px 8px;
    text-align: left;
    font-family: inherit;
    cursor: pointer;
    background: rgba(39, 51, 46, 0.85);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    transition: border-color 0.2s, box-shadow 0.2s;
    position: relative;
  }

  .exp-chip:hover {
    border-color: rgba(130, 168, 148, 0.45);
    box-shadow: 0 6px 18px rgba(12, 22, 18, 0.32);
  }

  .exp-chip:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .exp-chip-kind {
    display: block;
    font-size: 8px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 2px;
  }

  .exp-chip-title {
    display: block;
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    line-height: 1.25;
    margin-bottom: 2px;
  }

  .exp-chip-org {
    display: block;
    font-size: 9px;
    color: #ada597;
    line-height: 1.3;
  }

  .exp-chip-hint {
    position: absolute;
    top: 6px;
    right: 6px;
    font-size: 14px;
    color: var(--muted);
    opacity: 0.55;
  }

  .exp-detail {
    margin-top: 8px;
    padding: 10px 12px;
    background: rgba(20, 28, 24, 0.72);
    border: 1px solid var(--border);
    border-radius: 6px;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.35s ease, opacity 0.25s ease, margin 0.25s ease;
    pointer-events: none;
  }

  .exp-detail-range {
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .exp-detail-text {
    font-size: 11px;
    color: #c9c2b4;
    line-height: 1.65;
  }

  @media (hover: hover) and (min-width: 961px) {
    .exp-entry--education-only:hover .exp-detail,
    .exp-job-body:hover .exp-detail {
      max-height: 280px;
      opacity: 1;
      pointer-events: auto;
      overflow-y: auto;
    }
  }

  .exp-entry--education-only.exp-entry--pinned .exp-detail,
  .exp-job-body.exp-entry--pinned .exp-detail {
    max-height: 280px;
    opacity: 1;
    pointer-events: auto;
    overflow-y: auto;
  }

  .exp-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 14px 0 16px;
    margin-left: -16px;
    padding-left: 16px;
  }

  .exp-divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(
      90deg,
      transparent,
      var(--border) 20%,
      var(--border) 80%,
      transparent
    );
  }

  .exp-divider-label {
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    white-space: nowrap;
  }

  .exp-error {
    font-size: 12px;
    color: var(--muted);
  }

  @media (max-width: 960px) {
    .experience-rail {
      padding-top: 0;
      position: static;
      max-height: none;
      overflow: visible;
      margin-bottom: 48px;
    }

    .experience-heading {
      margin-bottom: 14px;
    }

    .exp-divider--jobs {
      flex: 0 0 auto;
      margin: 10px 0 12px;
    }

    .exp-entry--education-only:hover .exp-detail,
    .exp-job-body:hover .exp-detail {
      max-height: 0;
      opacity: 0;
      pointer-events: none;
    }

    .exp-entry--education-only.exp-entry--pinned .exp-detail,
    .exp-job-body.exp-entry--pinned .exp-detail {
      max-height: 320px;
      opacity: 1;
      pointer-events: auto;
    }

    .exp-layout {
      grid-template-columns: 1fr;
      gap: 28px;
    }

    .exp-education-col {
      grid-column: 1;
      flex-direction: column;
    }

    .exp-spine-col {
      grid-column: 1;
      max-width: 100%;
    }

    .exp-spine-track {
      flex-direction: row;
      min-height: 88px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 8px;
    }

    .exp-spine-segment {
      flex: 1 1 56px;
      min-width: 56px;
      min-height: 88px;
    }

    .exp-spine-year-text {
      writing-mode: horizontal-tb;
      transform: none;
      letter-spacing: 0.06em;
    }

    .exp-spine-row--divider-spacer {
      flex: 0 0 16px;
      min-width: 16px;
      min-height: 88px;
      border-right: none;
      border-bottom: none;
      border-left: 2px dashed var(--border);
    }

    .exp-jobs-col {
      grid-column: 1;
    }

    .exp-job-connector {
      margin-top: 12px;
    }
  }

  /* ── HERO ── */
  .hero {
    margin-bottom: 80px;
    animation: fadeUp 0.8s ease both;
  }

  .hero-label {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .hero-label::before {
    content: '';
    display: inline-block;
    width: 28px;
    height: 1px;
    background: var(--accent);
  }

  /* Same Syne treatment as hero name: section heading and modal titles */
  h1.hero-title,
  .section-header .section-heading,
  .modal-title {
    font-family: 'Syne', sans-serif;
    font-size: clamp(14px, 2.1vw, 22px);
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: 0.03em;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  h1.hero-title {
    margin-bottom: 0;
  }

  .hero-title-row {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 18px;
  }

  .hero-photo {
    width: 64px;
    height: 64px;
    border-radius: 12px;
    object-fit: cover;
    flex-shrink: 0;
    border: 1px solid var(--border);
    box-shadow: 0 6px 20px rgba(12, 22, 18, 0.35);
    background: var(--surface);
  }

  .hero-title-stack {
    min-width: 0;
    flex: 1 1 auto;
  }

  .hero-name-mid {
    font-weight: 500;
    color: var(--accent2);
    opacity: 0.9;
  }

  .hero-name-zh {
    display: block;
    margin-top: 0.45em;
    font-family: ui-sans-serif, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    font-size: inherit;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: var(--muted);
    line-height: 1.3;
  }

  .hero-sub {
    font-size: 14px;
    color: var(--muted);
    max-width: 480px;
    line-height: 1.7;
    letter-spacing: 0.01em;
  }

  .hero-sub-tagline {
    display: block;
    margin-top: 0.35em;
    font-style: italic;
    font-family: 'Syne', sans-serif;
    font-weight: 500;
    letter-spacing: 0.03em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .hero-links {
    margin-top: 28px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }

  .hero-links a {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid var(--border);
    padding-bottom: 3px;
    transition: color 0.2s, border-color 0.2s;
  }

  .hero-links a:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  @media (max-width: 520px) {
    .hero-title-row {
      gap: 12px;
    }

    .hero-photo {
      width: 52px;
      height: 52px;
      border-radius: 10px;
    }
  }

  /* ── SECTION HEADER ── */
  .section-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 32px;
    animation: fadeUp 0.8s 0.2s ease both;
  }

  .section-header::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── PROJECT GRID ── */
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(152px, 1fr));
    gap: 12px;
    animation: fadeUp 0.8s 0.3s ease both;
    align-items: stretch;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    padding-bottom: 36px;
    cursor: pointer;
    transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s;
    position: relative;
    overflow: hidden;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    height: 218px;
    min-height: 218px;
    max-height: 218px;
  }

  .card > * {
    position: relative;
    z-index: 1;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(110, 150, 130, 0.12) 0%, transparent 58%);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .card:hover {
    border-color: rgba(130, 168, 148, 0.5);
    transform: translateY(-3px);
    box-shadow: 0 14px 36px rgba(12, 22, 18, 0.4), 0 0 0 1px rgba(120, 160, 140, 0.2);
  }

  .card:hover::before { opacity: 1; }

  /* Photo layer reads softer (slightly transparent); darker tint keeps text readable */
  .card.card-with-bg {
    background-image: linear-gradient(
      165deg,
      rgba(35, 46, 41, 0.38) 0%,
      rgba(39, 50, 46, 0.44) 100%
    ), var(--card-bg-image);
    background-size: cover, cover;
    background-position: center, center;
    background-repeat: no-repeat;
  }

  .card.card-with-bg .card-title {
    text-shadow: 0 1px 18px rgba(0, 0, 0, 0.55), 0 0 24px rgba(0, 0, 0, 0.35);
  }

  .card.card-with-bg .tag {
    background: rgba(15, 22, 18, 0.45);
    border-color: rgba(255, 255, 255, 0.14);
  }

  .card-title {
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    font-size: clamp(17px, 2vw, 24px);
    font-weight: 500;
    line-height: 1.22;
    letter-spacing: 0.01em;
    color: #f8f4ee;
    max-width: 100%;
    text-wrap: balance;
  }

  .card-desc {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.65;
    margin-bottom: 12px;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    flex-shrink: 0;
    margin-top: auto;
  }

  .card-tags--footer {
    margin-top: auto;
    padding-right: 40px;
  }

  .tag {
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 3px 8px;
    border-radius: 3px;
    border: 1px solid var(--border);
    color: var(--muted);
    text-transform: uppercase;
  }

  .card-arrow {
    position: absolute;
    bottom: 22px;
    right: 22px;
    width: 28px;
    height: 28px;
    border: 1px solid var(--border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 12px;
    transition: border-color 0.25s, color 0.25s, transform 0.25s;
  }

  .card:hover .card-arrow {
    border-color: var(--accent);
    color: var(--accent);
    transform: translate(2px, -2px);
  }

  @media (max-width: 480px) {
    .card {
      height: min(218px, 78vh);
      min-height: min(218px, 78vh);
      max-height: min(218px, 78vh);
    }
  }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(22, 30, 26, 0.84);
    backdrop-filter: blur(8px);
    z-index: 100;
    padding: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    box-sizing: border-box;
  }

  .modal-overlay.active {
    opacity: 1;
    pointer-events: all;
  }

  /* Project photos use --card-bg-image on .card.card-with-bg only; modal stays a solid panel */
  .modal {
    --card-bg-image: none;
    position: absolute;
    top: max(12px, env(safe-area-inset-top, 0px));
    right: max(12px, env(safe-area-inset-right, 0px));
    bottom: max(12px, env(safe-area-inset-bottom, 0px));
    left: max(12px, env(safe-area-inset-left, 0px));
    width: auto;
    height: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: clamp(8px, 2vw, 14px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    transform: translateY(12px) scale(0.99);
    transition: transform 0.3s;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .modal-overlay.active .modal {
    transform: translateY(0) scale(1);
  }

  .modal-header {
    padding: 32px 32px 0;
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 2;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .modal-header--minimal {
    padding-bottom: 16px;
    min-height: 56px;
  }

  .modal-header--lobster {
    position: relative;
    text-align: center;
    padding-left: 52px;
    padding-right: 52px;
  }

  .modal-header--lobster .modal-title {
    margin-bottom: 0;
  }

  .modal-header--db {
    position: relative;
    text-align: center;
    padding-left: 52px;
    padding-right: 52px;
  }

  .modal-header--db .modal-title {
    margin-bottom: 0;
  }

  .modal-close {
    position: absolute;
    top: 24px;
    right: 24px;
    width: 32px;
    height: 32px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 50%;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s, color 0.2s;
    font-family: 'DM Mono', monospace;
  }

  .modal-close:hover { border-color: var(--accent2); color: var(--accent2); }

  .modal-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .modal-title {
    margin-bottom: 12px;
  }

  .modal-period {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .modal-body {
    padding: 28px 32px 32px;
  }

  .project-popup-content > :last-child {
    margin-bottom: 0;
  }

  .project-popup-content .github-link {
    margin-top: 0;
  }

  .uhi-popup-title {
    text-align: center;
    font-family: 'Syne', sans-serif;
