<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Henry Guo — Data Scientist</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""
>
<style>
  :root {
    --bg: #232e29;
    --surface: #2c3a34;
    --border: #3d4e47;
    --accent: #d4af61;
    --accent2: #c24a3d;
    --text: #f0ebe2;
    --muted: #9aa396;
    --card-bg: #27332e;
    /* Between 110% and 125% browser zoom; scales px layout and type together */
    --page-scale: 1.175;
  }

  html {
    zoom: var(--page-scale);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(115, 155, 135, 0.09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(115, 155, 135, 0.09) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  /* Soft centered wash — avoids a bright patch in the top-left corner */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 100% 55% at 50% 0%, rgba(90, 135, 115, 0.06) 0%, transparent 62%);
    pointer-events: none;
    z-index: 0;
  }

  main {
    position: relative;
    z-index: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: 80px 32px 120px;
  }

  /* ── HERO ── */
  .hero {
    margin-bottom: 80px;
    animation: fadeUp 0.8s ease both;
  }

  .hero-label {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .hero-label::before {
    content: '';
    display: inline-block;
    width: 28px;
    height: 1px;
    background: var(--accent);
  }

  /* Same Syne treatment as hero name: section heading and modal titles */
  h1.hero-title,
  .section-header .section-heading,
  .modal-title {
    font-family: 'Syne', sans-serif;
    font-size: clamp(14px, 2.1vw, 22px);
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: 0.03em;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  h1.hero-title {
    margin-bottom: 18px;
  }

  .hero-name-mid {
    font-weight: 500;
    color: var(--accent2);
    opacity: 0.9;
  }

  .hero-name-zh {
    display: block;
    margin-top: 0.45em;
    font-family: ui-sans-serif, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    font-size: inherit;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: var(--muted);
    line-height: 1.3;
  }

  .hero-sub {
    font-size: 14px;
    color: var(--muted);
    max-width: 480px;
    line-height: 1.7;
    letter-spacing: 0.01em;
  }

  .hero-sub-tagline {
    display: block;
    margin-top: 0.35em;
    font-style: italic;
    font-family: 'Syne', sans-serif;
    font-weight: 500;
    letter-spacing: 0.03em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .hero-links {
    margin-top: 28px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }

  .hero-links a {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid var(--border);
    padding-bottom: 3px;
    transition: color 0.2s, border-color 0.2s;
  }

  .hero-links a:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  /* ── SECTION HEADER ── */
  .section-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 32px;
    animation: fadeUp 0.8s 0.2s ease both;
  }

  .section-header::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── PROJECT GRID ── */
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    animation: fadeUp 0.8s 0.3s ease both;
    align-items: stretch;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 28px;
    padding-bottom: 56px;
    cursor: pointer;
    transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s;
    position: relative;
    overflow: hidden;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    height: 400px;
    min-height: 400px;
    max-height: 400px;
  }

  .card > * {
    position: relative;
    z-index: 1;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(110, 150, 130, 0.12) 0%, transparent 58%);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .card:hover {
    border-color: rgba(130, 168, 148, 0.5);
    transform: translateY(-3px);
    box-shadow: 0 14px 36px rgba(12, 22, 18, 0.4), 0 0 0 1px rgba(120, 160, 140, 0.2);
  }

  .card:hover::before { opacity: 1; }

  /* Photo layer reads softer (slightly transparent); darker tint keeps text readable */
  .card.card-with-bg {
    background-image: linear-gradient(
      165deg,
      rgba(35, 46, 41, 0.38) 0%,
      rgba(39, 50, 46, 0.44) 100%
    ), var(--card-bg-image);
    background-size: cover, cover;
    background-position: center, center;
    background-repeat: no-repeat;
  }

  .card.card-with-bg .card-title {
    text-shadow: 0 1px 18px rgba(0, 0, 0, 0.55), 0 0 24px rgba(0, 0, 0, 0.35);
  }

  .card.card-with-bg .tag {
    background: rgba(15, 22, 18, 0.45);
    border-color: rgba(255, 255, 255, 0.14);
  }

  .card-title {
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    font-size: clamp(22px, 2.5vw, 30px);
    font-weight: 500;
    line-height: 1.22;
    letter-spacing: 0.01em;
    color: #f8f4ee;
    max-width: 100%;
    text-wrap: balance;
  }

  .card-desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
    margin-bottom: 16px;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    flex-shrink: 0;
    margin-top: auto;
  }

  .card-tags--footer {
    margin-top: auto;
    padding-right: 40px;
  }

  .tag {
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 3px 8px;
    border-radius: 3px;
    border: 1px solid var(--border);
    color: var(--muted);
    text-transform: uppercase;
  }

  .card-arrow {
    position: absolute;
    bottom: 28px;
    right: 28px;
    width: 28px;
    height: 28px;
    border: 1px solid var(--border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 12px;
    transition: border-color 0.25s, color 0.25s, transform 0.25s;
  }

  .card:hover .card-arrow {
    border-color: var(--accent);
    color: var(--accent);
    transform: translate(2px, -2px);
  }

  @media (max-width: 480px) {
    .card {
      height: min(400px, 78vh);
      min-height: min(400px, 78vh);
      max-height: min(400px, 78vh);
    }
  }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(22, 30, 26, 0.84);
    backdrop-filter: blur(8px);
    z-index: 100;
    padding: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    box-sizing: border-box;
  }

  .modal-overlay.active {
    opacity: 1;
    pointer-events: all;
  }

  /* Project photos use --card-bg-image on .card.card-with-bg only; modal stays a solid panel */
  .modal {
    --card-bg-image: none;
    position: absolute;
    top: max(12px, env(safe-area-inset-top, 0px));
    right: max(12px, env(safe-area-inset-right, 0px));
    bottom: max(12px, env(safe-area-inset-bottom, 0px));
    left: max(12px, env(safe-area-inset-left, 0px));
    width: auto;
    height: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: clamp(8px, 2vw, 14px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    transform: translateY(12px) scale(0.99);
    transition: transform 0.3s;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .modal-overlay.active .modal {
    transform: translateY(0) scale(1);
  }

  .modal-header {
    padding: 32px 32px 0;
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 2;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .modal-header--minimal {
    padding-bottom: 16px;
    min-height: 56px;
  }

  .modal-header--lobster {
    position: relative;
    text-align: center;
    padding-left: 52px;
    padding-right: 52px;
  }

  .modal-header--lobster .modal-title {
    margin-bottom: 0;
  }

  .modal-header--db {
    position: relative;
    text-align: center;
    padding-left: 52px;
    padding-right: 52px;
  }

  .modal-header--db .modal-title {
    margin-bottom: 0;
  }

  .modal-close {
    position: absolute;
    top: 24px;
    right: 24px;
    width: 32px;
    height: 32px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 50%;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s, color 0.2s;
    font-family: 'DM Mono', monospace;
  }

  .modal-close:hover { border-color: var(--accent2); color: var(--accent2); }

  .modal-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .modal-title {
    margin-bottom: 12px;
  }

  .modal-period {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .modal-body {
    padding: 28px 32px 32px;
  }

  .project-popup-content > :last-child {
    margin-bottom: 0;
  }

  .project-popup-content .github-link {
    margin-top: 0;
  }

  .uhi-popup-title {
    text-align: center;
    font-family: 'Syne', sans-serif;
    font-size: clamp(18px, 2.4vw, 26px);
    margin-bottom: 18px;
  }

  .uhi-methods-split {
    display: grid;
    grid-template-columns: 1fr minmax(220px, 340px);
    gap: 20px;
    align-items: start;
  }

  .uhi-methods-list {
    margin: 0;
  }

  .uhi-lc-stats {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    background: rgba(20, 28, 24, 0.5);
  }

  .uhi-lc-stats-title {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .uhi-lc-stats-ref {
    font-size: 11px;
    line-height: 1.65;
    color: var(--muted);
    margin: 0 0 12px;
  }

  .uhi-lc-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    color: #c9c2b4;
  }

  .uhi-lc-table th,
  .uhi-lc-table td {
    border-bottom: 1px solid var(--border);
    padding: 8px 6px;
    vertical-align: top;
  }

  .uhi-lc-table tbody tr:last-child td {
    border-bottom: none;
  }

  .uhi-lc-table th {
    font-weight: 500;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .uhi-lc-table th:last-child,
  .uhi-lc-table td:last-child {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .uhi-lc-gap {
    margin: 10px 0 0;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .uhi-bottom-split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    align-items: start;
  }

  .boston-uhi-popup .modal-section-label {
    font-size: 11px;
  }

  .boston-uhi-popup .modal-overview {
    font-size: 14px;
  }

  .boston-uhi-popup .detail-list li {
    font-size: 13px;
  }

  .boston-uhi-popup .uhi-toggle {
    font-size: 12px;
  }

  .boston-uhi-popup .uhi-context-title {
    font-size: 12px;
  }

  .boston-uhi-popup .uhi-opacity-title,
  .boston-uhi-popup .uhi-opacity-row label,
  .boston-uhi-popup .uhi-lc-stats-title,
  .boston-uhi-popup .uhi-lc-table th {
    font-size: 11px;
  }

  .boston-uhi-popup .uhi-lc-stats-ref,
  .boston-uhi-popup .uhi-lc-table,
  .boston-uhi-popup .uhi-lc-gap {
    font-size: 13px;
  }

  .boston-uhi-popup .detail-list li::before {
    font-size: 11px;
  }

  /* Lobster larvae case study */
  .lobster-popup .modal-section-label {
    font-size: 11px;
  }

  .lobster-popup .modal-overview {
    font-size: 15px;
  }

  .lobster-popup .lobster-credit {
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
  }

  .lobster-popup .lobster-note {
    font-size: 14px;
    margin-top: 10px;
  }

  .lobster-popup .detail-list li {
    font-size: 14px;
  }

  .lobster-popup .detail-list li::before {
    font-size: 11px;
    top: 3px;
  }

  .lobster-popup .metric-value {
    font-size: 24px;
  }

  .lobster-popup .metric-label {
    font-size: 11px;
  }

  .lobster-popup .lobster-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    margin-top: 8px;
  }

  .lobster-popup .lobster-table th,
  .lobster-popup .lobster-table td {
    border: 1px solid var(--border);
    padding: 8px 10px;
    text-align: left;
  }

  .lobster-popup .lobster-table tbody tr:last-child td {
    border-bottom: 1px solid var(--border);
  }

  .lobster-popup .lobster-table th {
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    font-size: 11px;
    background: rgba(212, 175, 97, 0.08);
  }

  .lobster-popup .lobster-table td:not(:first-child) {
    font-variant-numeric: tabular-nums;
  }

  .lobster-popup .lobster-figure-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 8px;
  }

  .lobster-popup .lobster-figure {
    margin: 0;
    min-width: 0;
  }

  .lobster-popup .lobster-figure img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: rgba(0, 0, 0, 0.2);
  }

  .lobster-popup .lobster-figure figcaption {
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
    line-height: 1.5;
  }

  .lobster-popup code {
    font-size: 0.9em;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid var(--border);
  }

  .lobster-popup .lobster-refs a {
    color: var(--accent);
  }

  @media (max-width: 720px) {
    .uhi-methods-split {
      grid-template-columns: 1fr;
    }

    .uhi-bottom-split {
      grid-template-columns: 1fr;
    }

    .lobster-popup .lobster-figure-grid {
      grid-template-columns: 1fr;
    }

    .lobster-popup .lobster-table {
      display: block;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
  }

  .uhi-map-shell {
    position: relative;
    margin-bottom: 18px;
    overflow: hidden;
    border-radius: 0;
  }

  .uhi-map-shell,
  .uhi-map-shell * {
    box-sizing: border-box;
  }

  .uhi-map-shell::before,
  .uhi-map-shell::after {
    content: none;
    display: none;
  }

  .uhi-map-shell:empty {
    margin-bottom: 18px;
  }

  .uhi-main {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 14px;
    align-items: start;
    margin-bottom: 18px;
  }

  .uhi-side {
    min-width: 0;
  }

  .uhi-map {
    width: 100%;
    height: min(52vh, 520px);
    background: #1f2925;
    border: none;
    border-radius: 0;
    box-shadow: none;
    overflow: visible;
  }

  .uhi-controls {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }

  .uhi-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .uhi-context-card {
    display: none;
    margin-bottom: 12px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: rgba(20, 28, 24, 0.5);
  }

  .uhi-context-card.active {
    display: block;
  }

  .uhi-context-title {
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .uhi-opacity-panel {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    margin-bottom: 14px;
    background: rgba(20, 28, 24, 0.5);
  }

  .uhi-opacity-title {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .uhi-opacity-row {
    display: none;
    grid-template-columns: 44px 1fr;
    align-items: center;
    gap: 8px;
    margin-bottom: 7px;
  }

  .uhi-opacity-row.active {
    display: grid;
  }

  .uhi-opacity-row label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .uhi-opacity-row input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }

  @media (max-width: 980px) {
    .uhi-main {
      grid-template-columns: 1fr;
    }
  }

  .modal-section {
    margin-bottom: 28px;
  }

  .modal-section-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .modal-section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .modal-overview {
    font-size: 13px;
    line-height: 1.8;
    color: #c9c2b4;
  }

  .modal-under-construction {
    font-family: 'Syne', sans-serif;
    font-size: clamp(18px, 2.5vw, 24px);
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--accent);
    margin-bottom: 12px;
  }

  /* Metrics row */
  .metrics {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }

  .metric {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
  }

  .metric-value {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 6px;
  }

  .metric-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    line-height: 1.4;
  }

  /* Image placeholder */
  .img-placeholder {
    width: 100%;
    aspect-ratio: 16/7;
    background: var(--bg);
    border: 1px dashed var(--border);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .img-placeholder svg { opacity: 0.3; }

  .img-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .img-grid .img-placeholder { aspect-ratio: 4/3; }

  /* Bullet list */
  .detail-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .detail-list li {
    font-size: 12px;
    color: #ada597;
    line-height: 1.7;
    padding-left: 16px;
    position: relative;
  }

  .detail-list li::before {
    content: '→';
    position: absolute;
    left: 0;
    color: var(--accent);
    font-size: 10px;
    top: 2px;
  }

  /* Restaurant DB architecture visualization */
  .db-popup .arch-lanes {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }

  .db-popup .arch-erd-grid {
    display: grid;
    grid-template-columns: 1.45fr 1.1fr;
    gap: 18px;
    align-items: start;
  }

  .db-popup .arch-step {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: rgba(20, 28, 24, 0.55);
    padding: 10px 12px;
    min-height: 88px;
  }

  .db-popup .arch-step-title {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }

  .db-popup .arch-step-desc {
    font-size: 12px;
    color: #c9c2b4;
    line-height: 1.55;
  }

  .db-popup .arch-lane-col {
    display: grid;
    gap: 10px;
    align-content: start;
  }

  .db-popup .arch-connector {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: var(--muted);
    min-height: 20px;
    letter-spacing: 0.04em;
  }

  .db-popup .arch-arrow {
    font-size: 18px;
    color: var(--muted);
    line-height: 1;
    text-align: center;
  }

  .db-popup .erd-figure {
    margin: 0 auto;
    max-width: 520px;
    width: 100%;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #f2f3ef;
  }

  .db-popup .erd-image {
    width: 100%;
    height: auto;
    display: block;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #f2f3ef;
  }

  .db-popup .sample-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
    gap: 12px;
    align-items: start;
  }

  .db-popup .sample-card {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: rgba(20, 28, 24, 0.55);
    padding: 10px;
    min-width: 0;
  }

  .db-popup .sample-title {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .db-popup .sample-table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .db-popup .sample-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
    color: #c9c2b4;
  }

  .db-popup .sample-table th,
  .db-popup .sample-table td {
    border-bottom: 1px solid var(--border);
    padding: 6px 5px;
    text-align: left;
    vertical-align: top;
    white-space: nowrap;
  }

  .db-popup .sample-table th {
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }

  .db-popup .sample-placeholder {
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 14px;
    font-size: 12px;
    line-height: 1.6;
    color: var(--muted);
    background: rgba(0, 0, 0, 0.14);
  }

  .db-popup .figure-shell {
    margin-top: 10px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    min-height: 170px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    background: rgba(0, 0, 0, 0.12);
  }

  .db-popup .sample-image {
    width: 100%;
    height: auto;
    display: block;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.2);
  }

  .db-popup .sample-image--table1 {
    min-height: 360px;
    object-fit: contain;
    background: #f2f3ef;
  }

  .db-popup .sample-image-stack {
    display: grid;
    gap: 8px;
  }

  @media (max-width: 860px) {
    .db-popup .arch-erd-grid {
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .db-popup .arch-lanes {
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .db-popup .sample-grid {
      grid-template-columns: 1fr;
    }

    .db-popup .arch-connector {
      min-height: 0;
    }
  }

  /* Tags in modal */
  .modal-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
  }

  .modal-tag {
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border-radius: 3px;
    border: 1px solid rgba(212,175,97,0.35);
    color: var(--accent);
    text-transform: uppercase;
    background: rgba(212,175,97,0.1);
  }

  .github-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text);
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 18px;
    transition: border-color 0.2s, color 0.2s;
    margin-top: 8px;
  }

  .github-link:hover { border-color: var(--accent); color: var(--accent); }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
